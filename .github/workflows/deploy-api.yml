name: Deploy Cloudflare API
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'scripts/deploy-api.mjs', 'scripts/lib/b2.mjs', 'package-lock.json', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
      B2_READ_APPLICATION_KEY: ${{ secrets.B2_READ_APPLICATION_KEY }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:api
